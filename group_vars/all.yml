---
lan_ranges:
  - 10.0.0.0/8

# Each entry gets: a systemd unit, an mDNS alias "<name>.local", and an nginx
# vhost proxying "<name>.local" -> 127.0.0.1:<port>. See README for how to
# add one.
sites:
  - name: library
    description: Library web app
    workdir: /home/bryan/git/jp-audiobooks
    exec_start: /home/bryan/.local/bin/uv run cli.py serve
    port: 8000
    environment:
      EPUB_LIBRARY_ENV: prod
  - name: pathways
    description: Pathways retirement projection app
    workdir: /home/bryan/git/pathways
    exec_start: /home/bryan/.local/bin/uv run python app.py
    port: 8001
    environment:
      PATHWAYS_ENV: prod
      PORT: 8001
